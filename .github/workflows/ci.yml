name: CI 

on:
  push:
    branches: [dev]
  pull_request:


concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build-and-test:
    name: Build extension and run GUT tests for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
          include:
            - name: 🐧 Linux 
              os: ubuntu-latest
              platform: linux
              binary_name: Godot_v4.7-stable_linux.x86_64
              download_url: "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip"
              destination: /usr/local/bin/godot

            - name: 🏁 Windows
              os: windows-latest
              platform: windows
              binary_name: Godot_v4.7-stable_win64.exe
              download_url: "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip"
              destination: C:\godot\godot.exe
    
    steps:
      - name: Checkout repo 
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install scons
        run: python -m pip install scons 

      - name: Cache godot-cpp build
        uses: actions/cache@v4 
        with:
          path: MusicPlayerGDextension/godot-cpp/bin
          key: godot-cpp-${{ runner.os }}-${{ hashFiles('.gitmodules') }}
      
      - name: Set up MinGW
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-scons
      
      - name: Build GDExtension (Linux)
        working-directory: MusicPlayerGDextension
        run: scons target=template_debug -j2
      
      - name: Build GDExtension (Windows with MinGW)
        working-directory: MusicPlayerGDextension
        shell: msys2 {0}
        run: scons target=template_debug -j2  
      
      - name: Download Godot (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          wget -q "${{ matrix.download_url }}" -O godot.zip
          unzip -q godot.zip
          chmod +x "${{ matrix.binary_name }}"
          sudo mv "${{ matrix.binary_name }}" "${{ matrix.destination }}"
      
      - name: Download Godot (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ matrix.download_url }}" -OutFile "godot.zip"
          Expand-Archive -Path "godot.zip" -DestinationPath "."
          New-Item -ItemType Directory -Force -Path "C:\godot"
          Move-Item -Path "${{ matrix.binary_name }}" -Destination "${{ matrix.destination }}" -Force
          echo "C:\godot" >> $env:GITHUB_PATH
      
      - name: Scan Project
        run: godot --headless --import --path . --editor --quit

      - name: Run GUT test suite
        run: godot --headless --path . -s addons/gut/gut_cmdln.gd -gdir=res://main/tests -ginclude_subdirs -gexit
